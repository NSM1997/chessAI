version: '3.8'

services:
  chess-ai-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - STOCKFISH_PATH=/usr/local/bin/stockfish
    volumes:
      - ./stockfish:/usr/local/bin/stockfish:ro
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

