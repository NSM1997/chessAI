<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin: 5px 0;
        }
        button:hover { background: #5a67d8; }
    </style>
</head>
<body>
    <h2>Chess AI Extension</h2>
    <div id="status" class="status info">Ready</div>
    
    <button id="test-extraction">Test FEN Extraction</button>
    <button id="toggle-overlay">Toggle Overlay</button>
    <button id="analyze-position">Analyze Position</button>
    
    <script src="popup.js"></script>
</body>
</html>
