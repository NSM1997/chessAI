<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess AI Server Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.online {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .status-indicator.offline {
            background: #ef4444;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: 'Courier New', monospace;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .response-box {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            max-height: 500px;
            overflow-y: auto;
        }

        .response-box pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #1f2937;
        }

        .analysis-result {
            background: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
        }

        .analysis-result h3 {
            color: #1e40af;
            margin-bottom: 10px;
        }

        .analysis-result p {
            margin: 5px 0;
            color: #1f2937;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background: #dbeafe;
            color: #1e40af;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin: 4px 4px 4px 0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .preset-positions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .preset-btn {
            background: white;
            border: 2px solid #e5e7eb;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .preset-btn:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .preset-btn strong {
            display: block;
            color: #374151;
            margin-bottom: 4px;
        }

        .preset-btn small {
            color: #6b7280;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Explainable Chess AI</h1>
            <p>Real-time Chess Position Analysis & Explanation</p>
        </div>

        <!-- Server Status Card -->
        <div class="card">
            <h2>
                <span class="status-indicator" id="statusIndicator"></span>
                Server Status
            </h2>
            <div class="response-box">
                <pre id="statusResponse">Checking server status...</pre>
            </div>
        </div>

        <!-- Analysis Card -->
        <div class="card">
            <h2>📊 Position Analysis</h2>
            
            <div class="input-group">
                <label>Quick Load Preset Positions:</label>
                <div class="preset-positions">
                    <div class="preset-btn" onclick="loadPreset('rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1')">
                        <strong>Starting Position</strong>
                        <small>After 1.e4</small>
                    </div>
                    <div class="preset-btn" onclick="loadPreset('r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3')">
                        <strong>Open Game</strong>
                        <small>After 1.e4 e5 2.Nf3 Nc6</small>
                    </div>
                    <div class="preset-btn" onclick="loadPreset('r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/3P1N2/PPP2PPP/RNBQK2R w KQkq - 4 5')">
                        <strong>Italian Game</strong>
                        <small>Classical setup</small>
                    </div>
                    <div class="preset-btn" onclick="loadPreset('8/5k2/3p4/1p1Pp2p/pP2Pp1P/P4P1K/8/8 b - - 99 50')">
                        <strong>Endgame</strong>
                        <small>King & Pawns</small>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label for="fenInput">FEN Position:</label>
                <textarea 
                    id="fenInput" 
                    placeholder="Enter FEN position (e.g., rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1)"
                >rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1</textarea>
            </div>

            <div class="button-group">
                <button onclick="analyzePosition()">🔍 Analyze Position</button>
                <button onclick="clearResults()" style="background: #6b7280;">Clear Results</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #6b7280;">Analyzing position...</p>
            </div>

            <div id="analysisResults"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8001';

        // Check server status on load
        async function checkServerStatus() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                
                const indicator = document.getElementById('statusIndicator');
                const statusResponse = document.getElementById('statusResponse');
                
                if (response.ok) {
                    indicator.className = 'status-indicator online';
                    statusResponse.textContent = JSON.stringify(data, null, 2);
                } else {
                    indicator.className = 'status-indicator offline';
                    statusResponse.textContent = 'Server is offline or not responding';
                }
            } catch (error) {
                const indicator = document.getElementById('statusIndicator');
                const statusResponse = document.getElementById('statusResponse');
                indicator.className = 'status-indicator offline';
                statusResponse.textContent = `Error: ${error.message}\n\nMake sure the server is running on port 8001`;
            }
        }

        // Load preset position
        function loadPreset(fen) {
            document.getElementById('fenInput').value = fen;
        }

        // Analyze position
        async function analyzePosition() {
            const fen = document.getElementById('fenInput').value.trim();
            const loading = document.getElementById('loading');
            const resultsDiv = document.getElementById('analysisResults');

            if (!fen) {
                alert('Please enter a FEN position');
                return;
            }

            loading.classList.add('active');
            resultsDiv.innerHTML = '';

            try {
                const response = await fetch(`${API_URL}/analyze-position`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ fen: fen })
                });

                const data = await response.json();

                if (response.ok) {
                    displayAnalysisResults(data);
                } else {
                    resultsDiv.innerHTML = `
                        <div class="response-box" style="border-color: #ef4444;">
                            <pre style="color: #ef4444;">${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="response-box" style="border-color: #ef4444;">
                        <pre style="color: #ef4444;">Error: ${error.message}</pre>
                    </div>
                `;
            } finally {
                loading.classList.remove('active');
            }
        }

        // Display analysis results
        function displayAnalysisResults(data) {
            const resultsDiv = document.getElementById('analysisResults');
            
            const bestMove = data.best_moves[0];
            const explanation = data.explanations[0];
            const evaluation = data.position_evaluation;

            let html = `
                <div class="analysis-result">
                    <h3>🎯 Best Move: ${bestMove.san} (${bestMove.move})</h3>
                    <p><strong>Score:</strong> ${bestMove.score.display}</p>
                    <p><strong>Depth:</strong> ${bestMove.depth}</p>
                </div>

                <div class="analysis-result">
                    <h3>💡 Explanation</h3>
                    <p>${explanation.explanation}</p>
                    <p style="margin-top: 10px;"><strong>Confidence:</strong> ${(explanation.confidence * 100).toFixed(0)}%</p>
                </div>
            `;

            if (explanation.tactical_motifs && explanation.tactical_motifs.length > 0) {
                html += `
                    <div class="analysis-result">
                        <h3>⚔️ Tactical Motifs</h3>
                        <div>
                            ${explanation.tactical_motifs.map(motif => `<span class="badge">${motif.replace('_', ' ')}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            if (explanation.strategic_concepts && explanation.strategic_concepts.length > 0) {
                html += `
                    <div class="analysis-result">
                        <h3>🎲 Strategic Concepts</h3>
                        <div>
                            ${explanation.strategic_concepts.map(concept => `<span class="badge">${concept.replace('_', ' ')}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            html += `
                <div class="analysis-result">
                    <h3>📈 Position Evaluation</h3>
                    <p><strong>Position Type:</strong> ${evaluation.position_type}</p>
                    <p><strong>Material Balance:</strong> ${evaluation.material_balance.difference > 0 ? '+' : ''}${evaluation.material_balance.difference}</p>
                    <p><strong>White Material:</strong> ${evaluation.material_balance.white}</p>
                    <p><strong>Black Material:</strong> ${evaluation.material_balance.black}</p>
                </div>
            `;

            if (data.learning_insights && data.learning_insights.length > 0) {
                html += `
                    <div class="analysis-result">
                        <h3>📚 Learning Insights</h3>
                        <ul style="list-style: none; padding-left: 0;">
                            ${data.learning_insights.map(insight => `<li style="margin: 8px 0;">• ${insight}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            html += `
                <div class="response-box">
                    <strong>Full JSON Response:</strong>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>
            `;

            resultsDiv.innerHTML = html;
        }

        // Clear results
        function clearResults() {
            document.getElementById('analysisResults').innerHTML = '';
            document.getElementById('fenInput').value = '';
        }

        // Check status on page load
        checkServerStatus();

        // Refresh status every 10 seconds
        setInterval(checkServerStatus, 10000);
    </script>
</body>
</html>
